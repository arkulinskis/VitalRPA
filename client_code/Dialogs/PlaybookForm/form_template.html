<div class="ui dlg">
  <anvil-component type="Label" name="heading" prop:text="New playbook" prop:role='["dlg-title"]'></anvil-component>
  <p class="muted">When this happens, the robot does that, day or night.</p>
  <div class="ui-stack">
    <label class="ui-field"><span>Name</span><anvil-component type="TextBox" name="name_box" prop:placeholder="Page the on-call"></anvil-component></label>
    <div class="pb-grid">
      <div class="ui-field"><span>When</span><anvil-component type="DropDown" name="trigger_box"></anvil-component></div>
      <div class="ui-field"><span>On</span><anvil-component type="DropDown" name="site_box"></anvil-component></div>
    </div>
    <div class="ui-field"><span>The robot will</span>
      <div class="pb-acts">
        <div class="pb-act">
          <anvil-component type="CheckBox" name="email_on" prop:text="Send an email"></anvil-component>
          <anvil-component type="TextBox" name="email_box" prop:type="email" prop:placeholder="Blank = my alert address"></anvil-component>
        </div>
        <div class="pb-act">
          <anvil-component type="CheckBox" name="hook_on" prop:text="Call a webhook (Slack, Teams, Discord, Zapier…)"></anvil-component>
          <anvil-component type="TextBox" name="hook_box" prop:placeholder="https://hooks.slack.com/services/…"></anvil-component>
        </div>
        <div class="pb-act">
          <anvil-component type="CheckBox" name="recheck_on" prop:text="Recheck with a second robot and note the result on the incident"></anvil-component>
        </div>
      </div>
    </div>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
    <div class="ui-row end">
      <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
      <anvil-component type="Button" name="save_button" prop:text="Save playbook" prop:role='["btn", "btn-primary", "ic-check"]'></anvil-component>
    </div>
  </div>
</div>
