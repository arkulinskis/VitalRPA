<div class="ui dlg">
  <h2 class="dlg-h">New heartbeat</h2>
  <p class="muted">For things that should happen on a schedule: backups, cron jobs, imports. They call a URL when they finish; if the call doesn't come, the watchdog opens an incident.</p>
  <div class="ui-stack">
    <label class="ui-field"><span>Name</span><anvil-component type="TextBox" name="name_box" prop:placeholder="Nightly database backup"></anvil-component></label>
    <div class="pb-grid">
      <div class="ui-field"><span>Checks in every</span><anvil-component type="DropDown" name="period_box"></anvil-component></div>
      <label class="ui-field"><span>Grace time (minutes)</span><anvil-component type="TextBox" name="grace_box" prop:type="number"></anvil-component></label>
    </div>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
    <div class="ui-row end">
      <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
      <anvil-component type="Button" name="save_button" prop:text="Save" prop:role='["btn", "btn-primary", "ic-check"]'></anvil-component>
    </div>
  </div>
</div>
