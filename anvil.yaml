metadata:
  description: 'Website robots for busy teams: uptime every hour, SSL and domain watch, a visitor beacon under 1 KB, and playbooks
    that act when something breaks.'
  logo_img: asset:icon-512.png
  title: 'VitalRPA: robots that watch your websites'
name: VitalRPA
native_deps:
  head_html: "<script src=\"_/theme/legal-kit.js?v=5784415754\"></script>\n<meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#ffffff\">\n<meta name=\"apple-mobile-web-app-capable\"\
    \ content=\"yes\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"\
    https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap\"\
    \ rel=\"stylesheet\">\n<link id=\"ui-favicon\" rel=\"icon\" type=\"image/svg+xml\" href=\"_/theme/icon.svg?v=876ca19ac4\"\
    >\n<link rel=\"apple-touch-icon\" href=\"_/theme/icon-180.png?v=876ca19ac4\">\n<script>\n/* Keep our tab icon: Anvil adds\
    \ its own <link rel=\"icon\">, so drop any other icon link. */\n(function () {\n  function keep() {\n    var ours = document.getElementById('ui-favicon');\n\
    \    if (!ours) return;\n    document.querySelectorAll('link[rel~=\"icon\"]').forEach(function (l) { if (l !== ours) l.remove();\
    \ });\n  }\n  keep();\n  document.addEventListener('DOMContentLoaded', keep);\n  window.addEventListener('load', keep);\n\
    })();\n</script>\n<link rel=\"stylesheet\" href=\"_/theme/app.css?v=46087fa026\">\n<script src=\"_/theme/app.js?v=9b01f60aca\"\
    ></script>\n"
package_name: VitalRPA
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
scheduled_tasks:
- job_id: YCG3B4EZ
  task_name: bot_tick
  time_spec:
    at: {}
    every: minute
    n: 5
- job_id: BMT6TV3P
  task_name: bot_daily
  time_spec:
    at:
      hour: 6
      minute: 0
    every: day
    n: 1
services:
- client_config:
    enable_v2: true
  server_config: {}
  source: /runtime/services/tables.yml
- client_config:
    allow_remember_me: true
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    remember_me_days: 30
    require_secure_passwords: true
    use_email: true
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/anvil/email.yml
startup:
  module: Main
  type: form
